<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Currency Shop</title>
<style>
  :root{
    --bg:#0d1117;
    --panel:#12181f;
    --panel-2:#161d25;
    --line:#22303c;
    --text:#e8edf2;
    --sub:#7c8a97;
    --accent:#5eead4;
    --accent-dim:#245751;
    --danger:#f87171;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f1f4f6; --panel:#ffffff; --panel-2:#f7f9fa; --line:#dbe2e8;
      --text:#101418; --sub:#5c6b78; --accent:#0f9b86; --accent-dim:#d3f3ee; --danger:#dc2626;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1117; --panel:#12181f; --panel-2:#161d25; --line:#22303c;
    --text:#e8edf2; --sub:#7c8a97; --accent:#5eead4; --accent-dim:#245751; --danger:#f87171;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  header{
    position:sticky;
    top:0;
    top:env(safe-area-inset-top,0px);
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    background:var(--bg);
    border-bottom:1px solid var(--line);
  }

  .brand{display:flex;align-items:center;gap:12px;}
  .brand-icon{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(155deg,var(--accent) 0%,var(--accent-dim) 100%);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;color:#08211d;
  }
  .brand-name{font-weight:600;font-size:16px;}

  .cart-btn{
    position:relative;
    display:flex;align-items:center;gap:8px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:11px;
    padding:9px 14px;
    color:var(--text);
    font-size:14px;
    cursor:pointer;
  }
  .cart-btn:hover{background:var(--panel-2);}
  .cart-badge{
    background:var(--accent);
    color:#08211d;
    font-size:11px;
    font-weight:700;
    min-width:18px;
    height:18px;
    border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    padding:0 5px;
  }

  main{
    max-width:920px;
    margin:0 auto;
    padding:24px 20px 60px;
  }

  h1{font-size:19px;margin:0 0 4px;}
  .subtitle{color:var(--sub);font-size:13px;margin:0 0 22px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:14px;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .card-icon{
    width:44px;height:44px;
    border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    background:var(--panel-2);
    border:1px solid var(--line);
  }

  .card-name{font-size:14px;font-weight:600;line-height:1.3;}
  .card-desc{font-size:12px;color:var(--sub);flex-grow:1;}

  .card-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:4px;
  }

  .price{font-size:15px;font-weight:700;}

  .buy-btn{
    background:var(--accent);
    color:#08211d;
    border:none;
    border-radius:9px;
    padding:8px 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .buy-btn:hover{filter:brightness(1.08);}
  .buy-btn:active{filter:brightness(0.94);}

  /* overlay + drawer */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
    z-index:20;
  }
  .overlay.open{opacity:1;pointer-events:auto;}

  .drawer{
    position:fixed;
    top:0;
    right:0;
    height:100%;
    width:min(380px,100%);
    background:var(--panel);
    border-left:1px solid var(--line);
    transform:translateX(100%);
    transition:transform .22s ease;
    z-index:21;
    display:flex;
    flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .drawer.open{transform:translateX(0);}

  .drawer-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;
    border-bottom:1px solid var(--line);
  }
  .drawer-head h2{font-size:16px;margin:0;}
  .close-btn{
    background:none;border:none;color:var(--sub);
    font-size:20px;cursor:pointer;line-height:1;padding:4px;
  }
  .close-btn:hover{color:var(--text);}

  .cart-items{
    flex-grow:1;
    overflow-y:auto;
    padding:12px 20px;
  }

  .empty-cart{
    color:var(--sub);
    font-size:13px;
    text-align:center;
    padding:40px 10px;
  }

  .cart-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .cart-row:last-child{border-bottom:none;}

  .cart-row-icon{
    width:34px;height:34px;border-radius:9px;
    background:var(--panel-2);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;flex-shrink:0;
  }
  .cart-row-info{flex-grow:1;min-width:0;}
  .cart-row-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cart-row-price{font-size:12px;color:var(--sub);}

  .qty{
    display:flex;align-items:center;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:9px;
    overflow:hidden;
  }
  .qty button{
    width:26px;height:26px;border:none;background:transparent;
    color:var(--text);font-size:14px;cursor:pointer;
  }
  .qty button:hover{background:var(--panel-2);}
  .qty span{width:22px;text-align:center;font-size:13px;}

  .remove-btn{
    background:none;border:none;color:var(--sub);
    font-size:16px;cursor:pointer;padding:2px 4px;flex-shrink:0;
  }
  .remove-btn:hover{color:var(--danger);}

  .drawer-foot{
    border-top:1px solid var(--line);
    padding:16px 20px;
  }
  .total-row{
    display:flex;justify-content:space-between;align-items:center;
    font-size:14px;margin-bottom:12px;
  }
  .total-row .sum{font-weight:700;font-size:17px;}

  .checkout-btn{
    width:100%;
    background:var(--accent);
    color:#08211d;
    border:none;
    border-radius:11px;
    padding:12px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .checkout-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .checkout-btn:not(:disabled):hover{filter:brightness(1.08);}

  .demo-note{
    font-size:11px;
    color:var(--sub);
    text-align:center;
    margin-top:10px;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:calc(24px + env(safe-area-inset-bottom,0px));
    transform:translate(-50%,20px);
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:12px 18px;
    border-radius:11px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:30;
    max-width:90%;
    text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">GC</div>
    <div class="brand-name">Game Currency Shop</div>
  </div>
  <button class="cart-btn" id="cartBtn">
    🛒 Корзина
    <span class="cart-badge" id="cartBadge">0</span>
  </button>
</header>

<main>
  <h1>Каталог товаров</h1>
  <p class="subtitle">Внутриигровая валюта и пополнение баланса</p>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>Корзина</h2>
    <button class="close-btn" id="closeBtn" aria-label="Закрыть">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="drawer-foot">
    <div class="total-row">
      <span>Итого</span>
      <span class="sum" id="totalSum">0 ₽</span>
    </div>
    <button class="checkout-btn" id="checkoutBtn" disabled>Оформить заказ</button>
    <div class="demo-note">Демо-интерфейс — оплата не выполняется</div>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
  const products = [
    { id:1, icon:'🪙', name:'Золотые монеты x1000', desc:'Базовая валюта для покупок в игре', price:4.99 },
    { id:2, icon:'💎', name:'Кристаллы x500', desc:'Премиум-валюта, редкие предметы', price:9.99 },
    { id:3, icon:'💳', name:'Пополнение баланса 10$', desc:'Зачисление на игровой счёт', price:10.00 },
    { id:4, icon:'🪙', name:'Золотые монеты x5000', desc:'Выгоднее при покупке большим пакетом', price:19.99 },
    { id:5, icon:'💎', name:'Кристаллы x1500', desc:'Премиум-валюта, редкие предметы', price:24.99 },
    { id:6, icon:'🎁', name:'Стартовый набор', desc:'Монеты + кристаллы для новичков', price:14.99 },
  ];

  const cart = {};

  const grid = document.getElementById('grid');
  const cartBtn = document.getElementById('cartBtn');
  const closeBtn = document.getElementById('closeBtn');
  const overlay = document.getElementById('overlay');
  const drawer = document.getElementById('drawer');
  const cartItemsEl = document.getElementById('cartItems');
  const cartBadge = document.getElementById('cartBadge');
  const totalSumEl = document.getElementById('totalSum');
  const checkoutBtn = document.getElementById('checkoutBtn');
  const toast = document.getElementById('toast');

  function fmt(n){
    return n.toFixed(2).replace(/\.00$/, '') + ' $';
  }

  function renderGrid(){
    grid.innerHTML = products.map(p => `
      <div class="card">
        <div class="card-icon">${p.icon}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-bottom">
          <span class="price">${fmt(p.price)}</span>
          <button class="buy-btn" data-id="${p.id}">Купить</button>
        </div>
      </div>
    `).join('');
  }

  function cartCount(){
    return Object.values(cart).reduce((s,q) => s+q, 0);
  }

  function cartTotal(){
    return Object.entries(cart).reduce((s,[id,q]) => {
      const p = products.find(x => x.id == id);
      return s + (p ? p.price*q : 0);
    }, 0);
  }

  function renderCart(){
    const ids = Object.keys(cart).filter(id => cart[id] > 0);
    cartBadge.textContent = cartCount();

    if(ids.length === 0){
      cartItemsEl.innerHTML = '<div class="empty-cart">Корзина пуста</div>';
      checkoutBtn.disabled = true;
    } else {
      cartItemsEl.innerHTML = ids.map(id => {
        const p = products.find(x => x.id == id);
        const q = cart[id];
        return `
          <div class="cart-row">
            <div class="cart-row-icon">${p.icon}</div>
            <div class="cart-row-info">
              <div class="cart-row-name">${p.name}</div>
              <div class="cart-row-price">${fmt(p.price)}</div>
            </div>
            <div class="qty">
              <button data-act="dec" data-id="${p.id}" aria-label="Уменьшить">−</button>
              <span>${q}</span>
              <button data-act="inc" data-id="${p.id}" aria-label="Увеличить">+</button>
            </div>
            <button class="remove-btn" data-act="remove" data-id="${p.id}" aria-label="Удалить">✕</button>
          </div>
        `;
      }).join('');
      checkoutBtn.disabled = false;
    }

    totalSumEl.textContent = fmt(cartTotal());
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function openCart(){
    overlay.classList.add('open');
    drawer.classList.add('open');
  }
  function closeCart(){
    overlay.classList.remove('open');
    drawer.classList.remove('open');
  }

  grid.addEventListener('click', e => {
    const btn = e.target.closest('.buy-btn');
    if(!btn) return;
    const id = btn.dataset.id;
    cart[id] = (cart[id] || 0) + 1;
    renderCart();
    const p = products.find(x => x.id == id);
    showToast(`Добавлено: ${p.name}`);
  });

  cartItemsEl.addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]');
    if(!btn) return;
    const id = btn.dataset.id;
    const act = btn.dataset.act;
    if(act === 'inc') cart[id] = (cart[id] || 0) + 1;
    if(act === 'dec') cart[id] = Math.max(0, (cart[id] || 0) - 1);
    if(act === 'remove') cart[id] = 0;
    renderCart();
  });

  cartBtn.addEventListener('click', openCart);
  closeBtn.addEventListener('click', closeCart);
  overlay.addEventListener('click', closeCart);

  checkoutBtn.addEventListener('click', () => {
    closeCart();
    showToast('Заказ оформлен (демо — оплата не выполняется)');
    setTimeout(() => {
      for(const id in cart) cart[id] = 0;
      renderCart();
    }, 400);
  });

  renderGrid();
  renderCart();
</script>

</body>
</html>
