services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - CONNECTION_STRING=Host=db;Port=5432;Database=app;Username=postgres;Password=1234
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=app
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: